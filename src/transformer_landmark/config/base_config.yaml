model:
  name: vit_b_16
  pretrained: true
  freeze_backbone: true
  num_emotions: 4
  gradual_unfreeze:
    enabled: true
    unfreeze_at_epoch: 10
    reduce_lr_on_unfreeze: true
    lr_reduction_factor: 0.1

data:
  train_csv: data/landmarks/Cleaned_TrainLabels.csv
  val_csv: data/landmarks/Cleaned_ValidationLabels.csv
  test_csv: data/landmarks/Cleaned_TestLabels.csv
  train_img_dir: data/Train
  val_img_dir: data/Validation
  test_img_dir: data/Test
  image_size: 224
  normalize_emotions: false

augmentation:
  train:
    enabled: true
    horizontal_flip_prob: 0.5
    jitter_std: 0.02
    rotation_degrees: 15.0
    scale_range: [0.95, 1.05]
    dropout_prob: 0.1
    dropout_landmark_prob: 0.05
  val:
    enabled: false

training:
  batch_size: 32
  num_epochs: 50
  num_workers: 4
  pin_memory: true
  learning_rate: 0.00001
  weight_decay: 0.0001
  gradient_clip: 1.0

loss:
  type: mse

optimizer:
  type: adam
  betas: [0.9, 0.999]
  eps: 1.0e-08

scheduler:
  type: reduce_on_plateau
  mode: min
  factor: 0.5
  patience: 5
  min_lr: 1.0e-07

early_stopping:
  patience: 10
  min_delta: 0.0001

output:
  checkpoint_dir: outputs/checkpoints_landmark
  log_dir: outputs/logs_landmark
  save_best_only: true
  save_frequency: 5

device:
  use_cuda: true
  cuda_device: 0
