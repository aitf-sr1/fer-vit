model:
  name: graph_transformer
  mode: classification
  d_model: 256
  num_heads: 8
  num_layers: 6
  dropout: 0.15
  readout: mean
  num_emotions: 4
  num_classes: 4

data:
  train_csv: data/landmarks/Cleaned_TrainLabels.csv
  val_csv: data/landmarks/Cleaned_ValidationLabels.csv
  test_csv: data/landmarks/Cleaned_TestLabels.csv
  train_img_dir: data/Train
  val_img_dir: data/Validation
  test_img_dir: data/Test
  image_size: 224

augmentation:
  train:
    enabled: true
    horizontal_flip_prob: 0.5
    jitter_std: 0.03
    rotation_degrees: 20.0
    scale_range: [0.9, 1.1]
    dropout_prob: 0.2
    dropout_landmark_prob: 0.1
  val:
    enabled: false

training:
  batch_size: 64
  num_epochs: 100
  num_workers: 4
  pin_memory: true
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 5.0

loss:
  type: cross_entropy
  num_emotions: 4
  label_smoothing: 0.0
  class_weights:
    - [0.207, 0.305, 0.433, 3.054]
    - [3.353, 0.551, 0.045, 0.052]
    - [0.059, 0.185, 0.490, 3.267]
    - [0.033, 0.150, 0.679, 3.138]

optimizer:
  type: adam
  betas: [0.9, 0.999]
  eps: 1.0e-08

scheduler:
  type: reduce_on_plateau
  mode: min
  factor: 0.5
  patience: 7
  min_lr: 1.0e-06

early_stopping:
  patience: 15
  min_delta: 0.001

output:
  checkpoint_dir: outputs/checkpoints_landmark
  save_best_only: true
  save_frequency: 5

device:
  use_cuda: true
  cuda_device: 0
wandb:
  prediction_table_freq: 5
