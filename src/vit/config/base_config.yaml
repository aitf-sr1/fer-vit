model:
  name: vit_b_16
  pretrained: true
  freeze_backbone: false
  num_emotions: 4

data:
  train_csv: data/Cleaned_TrainLabels.csv
  val_csv: data/Cleaned_ValidationLabels.csv
  test_csv: data/Cleaned_TestLabels.csv
  train_img_dir: data/Train
  val_img_dir: data/Validation
  test_img_dir: data/Test
  image_size: 224
  normalize_emotions: false

augmentation:
  train:
    random_horizontal_flip: true
    flip_prob: 0.5
    color_jitter: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
  imagenet_norm:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

training:
  batch_size: 32
  num_epochs: 50
  num_workers: 4
  pin_memory: true
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  
loss:
  type: mse
  
optimizer:
  type: adam
  betas: [0.9, 0.999]
  eps: 1.0e-08
  
scheduler:
  type: reduce_on_plateau
  mode: min
  factor: 0.5
  patience: 5
  min_lr: 1.0e-07
  
early_stopping:
  patience: 10
  min_delta: 0.0001
  
output:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  save_best_only: true
  save_frequency: 5

device:
  use_cuda: true
  cuda_device: 0
