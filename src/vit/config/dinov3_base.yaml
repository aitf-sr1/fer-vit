model:
  backbone: dinov3
  dinov3_variant: vit_small_patch16_dinov3
  dinov3_checkpoint: model/dinov3_vits16.pt
  freeze_backbone: true
  num_emotions: 4
  num_classes: 2
  gradual_unfreeze:
    enabled: true
    unfreeze_at_epoch: 10
    reduce_lr_on_unfreeze: true
    lr_reduction_factor: 0.1

data:
  dataset_type: binary
  image_path_column: frame_path
  train_csv: "data/first_data/train.csv"
  val_csv: "data/first_data/val.csv"
  test_csv: "data/first_data/test.csv"
  train_img_dir: "data/first_data"
  val_img_dir: "data/first_data"
  test_img_dir: "data/first_data"
  image_size: 224
  normalize_emotions: false

augmentation:
  train:
    random_horizontal_flip: true
    flip_prob: 0.5
    color_jitter: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
    random_rotation: true
    rotation_degrees: 15
    random_affine: true
    affine_degrees: 10
    affine_scale: [0.9, 1.1]
    random_perspective: true
    perspective_distortion: 0.2
    random_erasing: true
    erasing_prob: 0.3
    random_grayscale: true
    grayscale_prob: 0.1
  imagenet_norm:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

training:
  batch_size: 32
  num_epochs: 50
  num_workers: 4
  pin_memory: true
  learning_rate: 0.00001
  weight_decay: 0.0001
  gradient_clip: 1.0

loss:
  type: cross_entropy
  class_weights: auto
  label_smoothing: 0.1

optimizer:
  type: adam
  betas: [0.9, 0.999]
  eps: 1.0e-08

scheduler:
  type: reduce_on_plateau
  mode: min
  factor: 0.5
  patience: 5
  min_lr: 1.0e-07

early_stopping:
  patience: 10
  min_delta: 0.0001

output:
  checkpoint_dir: outputs/checkpoints_dinov3
  log_dir: outputs/logs_dinov3
  save_best_only: true
  save_frequency: 5

device:
  use_cuda: true
  cuda_device: 0

wandb:
  prediction_table_freq: 5
